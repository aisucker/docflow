services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docflow}?sslmode=disable
      APP_ADDR: :8080
      STORAGE_DIR: /app/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - file_data:/app/data
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api
volumes:
  postgres_data:
  file_data:
