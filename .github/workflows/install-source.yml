name: Install source bundle
on:
  push:
    paths:
      - '.bootstrap/ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and commit initial sources
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/ready
          cat .bootstrap/part-* | base64 --decode > /tmp/docflow.tar.xz
          echo 'ARCHIVE_SHA256_REPLACE /tmp/docflow.tar.xz' | sha256sum -c -
          tar -xJf /tmp/docflow.tar.xz --strip-components=1
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -m 'feat: add DocFlow MVP source code'; git push; }
