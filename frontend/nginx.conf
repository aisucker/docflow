server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 22m;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_read_timeout 60s; }
 location / { try_files $uri $uri/ /index.html; }
 add_header X-Content-Type-Options nosniff always;
}
